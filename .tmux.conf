# 把前缀键改为 Ctrl+a（很多人觉得更好按）
set -g prefix C-a
unbind C-b
bind C-a send-prefix

# 鼠标支持
set -g mouse on

# 使用更直观的分屏快捷键（| 和 -）
bind \ split-window -h
bind - split-window -v

# 状态栏美化（颜色 / 显示内容）
set -g status-style bg=colour235,fg=white

# ── Vim 风格切换面板 ──
bind h select-pane -L
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R


setw -g mode-keys vi
