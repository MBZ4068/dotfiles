include tokyouight.conf
# 字体设置：JetBrainsMono Nerd Font Mono（支持连字 + Nerd Font 图标）
# 中文字符通过 fontconfig 自动 fallback 到文泉驿等宽微米黑
font_family JetBrainsMono Nerd Font Mono
font_size 11.0

# 开启编程连字（->、==、!=、>=、<=等）
font_features JetBrainsMonoNFM-Regular +calt +liga

map ctrl+shift+g launch --stdin-source=@screen_scrollback  --type=overlay vim -R -

# 背景透明
background_opacity 1
dynamic_background_opacity yesindow_padding_width 0
