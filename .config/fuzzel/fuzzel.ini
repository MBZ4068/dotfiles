[colors]
background=353535ff
text=ffffffff
selection=4a4a4aff
selection-text=d0d0d0ff
selection-match=353535ff
match=d0d0d0ff
border=353535ff

[main]
lines=20
width=40
font=NotoSansM Nerd Font Mono:weight=medium
terminal=alacritty -1
match-counter=yes
enable-mouse=yes
dpi-aware=auto
# dynamic anchor opt-in: comment out/remove anchor= to stop scripts from forcing anchors (center/default).
anchor=center
icons-enabled=yes
match-mode=fzf
show-actions=no
layer=overlay
prompt=">> "
exit-on-keyboard-focus-loss=no

[border]
radius=5
width=1

[dmenu]
exit-immediately-if-empty=yes
